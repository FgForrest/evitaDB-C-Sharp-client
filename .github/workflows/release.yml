# Builds and releases a new public version of C# evitaDB driver a puts it into `Releases` section of GitHub

name: Release

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-release:
    name: Build and release
    permissions:
      # write permission is required to create a github release
      contents: write

      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        timeout-minutes: 60 # Set the timeout to 60 minutes for this job
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./EvitaDB.sln

      - name: Build solution
        run: dotnet build ./EvitaDB.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./EvitaDB.sln --configuration Release --no-build

      - name: Resolve new release version
        id: release_version
        uses: codacy/git-version@2.8.0
        with:
          prefix: 'v'
          minor-identifier: 'feat'
          major-identifier: '(breaking)' # this should be placed somewhere in the commit message like "feat: (breaking) some message"

      - name: Build query validator
        run: |
          cd EvitaDB.QueryValidator
          dotnet publish -r linux-x64 -c Release -p:PublishSingleFile=true --self-contained false -p:PublishDir=publish/linux-x64
          dotnet publish -r win-x64 -c Release -p:PublishSingleFile=true --self-contained false -p:PublishDir=publish/win-x64

      - name: Zip
        uses: vimtor/action-zip@v1.2
        with:
          dest: 'Validator.zip'
          files: 'EvitaDB.QueryValidator/publish/linux-x64/Validator'
          recursive: true

      - name: Zip
        uses: vimtor/action-zip@v1.2
        with:
          dest: 'Validator-win.zip'
          files: 'EvitaDB.QueryValidator/publish/win-x64/Validator.exe'
          recursive: true

      - name: Pack nuget
        env:
          NUGET_VERSION: $( echo ${{ steps.release_version.outputs.version }} | sed 's/^v//')
        run: |
          export CURRENT_VERSION="${{ steps.release_version.outputs.version }}"
          export NEW_VERSION="$( echo ${CURRENT_VERSION} | sed 's/^v//')"
          cd EvitaDB.Client
          dotnet pack -c Release -p:PackageVersion="${NEW_VERSION}" --no-build --no-restore

      - name: Create release
        id: create_release
        uses: release-drafter/release-drafter@v6
        with:
          version: ${{ steps.release_version.outputs.version }}
          publish: true

      - name: Upload validator archives to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release_version.outputs.version }}" Validator.zip Validator-win.zip --clobber

      - name: Publish nuget
        run: |
          export CURRENT_VERSION="${{ steps.release_version.outputs.version }}"
          export NEW_VERSION="$( echo ${CURRENT_VERSION} | sed 's/^v//')"
          cd EvitaDB.Client/bin/Release
          dotnet nuget push EvitaDB.Client."${NEW_VERSION}".nupkg --api-key ${{ secrets.NUGET_TOKEN }} --source https://api.nuget.org/v3/index.json
