# Builds the solution and runs the test suite

name: Test dev

on:
  workflow_dispatch:
  push:
    branches: ["dev", "catching-up"]
  pull_request:
    branches: ["dev", "master"]

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        timeout-minutes: 60 # Set the timeout to 60 minutes for this job
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./EvitaDB.sln

      - name: Build solution
        run: dotnet build ./EvitaDB.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./EvitaDB.sln --configuration Release --no-build
