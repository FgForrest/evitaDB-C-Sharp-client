# Builds the solution and runs the test suite

name: Test dev

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev", "master"]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        timeout-minutes: 60 # Set the timeout to 60 minutes for this job
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./EvitaDB.slnx

      - name: Build solution
        run: dotnet build ./EvitaDB.slnx --configuration Release --no-restore

      # Temporary: exports the NuGet package cache to a draft release so that
      # offline development environments (no nuget.org access) can hydrate a
      # local cache; remove once the catch-up work stabilizes.
      - name: Export NuGet cache to draft release
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf nuget-packages.tar.gz -C $HOME .nuget/packages
          gh release view nuget-cache --json id >/dev/null 2>&1 || \
            gh release create nuget-cache --draft \
              --title "NuGet cache (offline dev, temporary)" \
              --notes "Draft release holding the restored NuGet package cache for offline development environments. Never published; safe to delete."
          gh release upload nuget-cache nuget-packages.tar.gz --clobber

      - name: Run tests
        run: dotnet test ./EvitaDB.slnx --configuration Release --no-build
