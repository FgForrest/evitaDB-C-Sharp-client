# Serving a Blazor WebAssembly app is mostly three things: correct MIME types, letting the client-side
# router own unknown paths, and never caching the boot manifest.
#
# NOTE on MIME types: there is deliberately no `types { }` block here. A `types` block at server level
# *replaces* the inherited map wholesale, which would leave CSS and JS served as octet-stream. nginx has
# shipped `application/wasm` in its own mime.types since 1.21, and `.dat`/`.blat`/`.dll` are correctly
# covered by the default_type of application/octet-stream.

# Cache policy as a map rather than per-location `add_header`: an `add_header` inside a location silently
# discards every header inherited from the server level, so mixing the two would drop the security headers
# on exactly the paths that set their own caching.
#
# nginx matches exact strings first, then regexes in the order written; `default` covers the rest.
map $uri $storefront_cache {
    # SPA routes (no file extension) and index.html resolve here - the served document is always
    # index.html, which must never be cached or a redeploy hands back a stale app
    default                                        "no-cache, no-store, must-revalidate";
    ~^/_framework/blazor\.boot\.json$              "no-cache, no-store, must-revalidate";
    ~^/_framework/                                 "public, max-age=31536000, immutable";
    ~*\.(?:css|js|svg|png|jpe?g|gif|ico|woff2?)$   "public, max-age=604800";
}

server {
    # 8080 so the server can run unprivileged
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor publishes a .gz next to every asset; the official nginx images are built with
    # http_gzip_static_module, so those are served directly instead of compressing per request.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm
               image/svg+xml application/octet-stream;

    add_header Cache-Control $storefront_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client-side routing: /category/phones and /product/nokia-c3 are not files on disk, so anything that
    # does not resolve falls through to index.html for the Blazor router to pick up.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon-32x32.png {
        log_not_found off;
        access_log off;
    }
}
